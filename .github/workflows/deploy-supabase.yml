name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: household-hub-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: agcnrtltobpsmmoqifxt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      # Direct password authentication avoids the API-key metadata parsing path.
      - name: Deploy database migrations
        shell: bash
        run: |
          encoded_password="$(
            python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))'
          )"
          SUPABASE_DB_URL="postgresql://postgres:${encoded_password}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres?sslmode=require"
          printf '::add-mask::%s\n' "$encoded_password"
          printf '::add-mask::%s\n' "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
